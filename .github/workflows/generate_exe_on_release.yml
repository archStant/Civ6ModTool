name: Build Windows Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone executable
        run: |
          python -m nuitka `
            --standalone `
            --enable-plugin=tk-inter `
            --include-data-dir=assets=assets `
            --windows-console-mode=disable --windows-icon-from-ico=app.ico `
            --assume-yes-for-downloads `
            --product-name="Civ6ModGenerator" `
            --file-version=1.0 `
            --product-version=1.0 `
            --file-description="A GUI tool for generating Civ 6 mods" `
            --output-dir=dist `
            --output-filename=Civ6ModGenerator.exe `
            main.py

      - name: Package application
        run: |
          Compress-Archive `
            -Path "dist/main.dist/*" `
            -DestinationPath "dist/Civ6ModGenerator.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: dist/Civ6ModGenerator.zip

